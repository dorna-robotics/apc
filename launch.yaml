# apc — launch config.
#
# IN inventory: in_1 / in_2 are lists of 7 — index i is the number of
# discs stacked at anchor A(i+1) of that holder (0, or stack_size — the
# one number in hmi/default.j2). Total
# discs = sum of both lists. Stacks are consumed top-first, A1→A7, in_1
# until empty, then in_2.
#
# Per disc: create at its inventory position → pick → inspect → place on
# anode → cathode down → read C → cathode up → pick → sort to out good/bad
# by the capacitance window (C_MIN..C_MAX in actions.py). Ordered drop:
# pass fills out_good_1 then _2 (A1→A7); a fail by the reading fills out_bad_1
# A1→A4, a stuck one (the anode still showed a disc after the pick) A5, a
# fail by a camera out_bad_1 A6→A7 (LANES in actions.py); z steps
# by Z_STEP per disc, max stack_size per slot. Every sorted disc is
# deleted right after it's placed; Start sweeps leftovers from killed runs.

project_name: apc
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py
default:      hmi/default.j2       # the kwargs' defaults (data — Python reads it)
setup:        hmi/setup.js         # run-setup screen: click the in stacks full/empty
pendant:      hmi/pendant.js       # during-run screen: live holders, tally, last reading
replan:       hmi/replan.js        # the Replan choice drawn on the bench: choose, clear the bench, confirm

# Station-local state folder (calibrate.json, ik.json, path.json).
# Relative to this folder, or absolute. Git-ignored — per-station truth.
core_dir:     core

# Where the platform writes — relative to this folder, or absolute.
# Not declared = off: run records stay in memory, no replay is saved,
# a file parameter's Open has no folder.
records:      records             # each run's rt.record files: <run>/records.jsonl, .csv — the per-disc sheet
replays:      replays             # replay recordings
uploads:      uploads             # where a file parameter's Open browses
counts:       counts/counts.json  # rt.count's totals across every run: discs picked / sorted (n, good, bad), inspections, measures, runs

# The file browser's tabs, in this order — display only: listing a
# folder never makes anything be saved into it. captures/ is written by
# the detections themselves (vision/*.yaml display.client_save_*) — off
# for now, the tab stays.
folders:
  - {key: records,  label: Records,  path: records,  read_only: false}
  - {key: uploads,  label: Uploads,  path: uploads,  read_only: false}
  - {key: captures, label: Captures, path: captures, read_only: false}
  - {key: replays,  label: Replays,  path: replays,  read_only: false}
  - {key: counts,   label: Counts,   path: counts,   read_only: false}
  - {key: log,      label: Log,      path: log,      read_only: true}   # the project's console, orchestrator-written
  - {key: docs,     label: Docs,     path: docs,     read_only: true}   # the bench's sheets (LCR meter startup) — source, read here, edited in git

plan_window:  4
scheduler:    cpsat

# The kwargs (in_1 / in_2) live in hmi/default.j2 and are set through
# hmi/setup.js, which draws the five disc holders as the operator sees
# them and lets them mark each IN stack full or empty.
