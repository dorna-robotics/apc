# The disc's FACE CLASSIFIER — recipes.j2 inspector_face (bottom_face,
# station camera) and inspector_robot_face (top_face, robot camera), run
# on the bare face: a circle FACE_MARGIN px inside the band's inner circle
# (the disc's edge on the robot camera), grey outside, cropped (actions.py
# _face_roi). On only when the run's face_check is ticked.
# The model is the whole-disc classifier for now, so the step runs; swap
# in the face model (trained on these crops) by changing ``path`` here —
# nothing else names it. Nothing is saved; to collect the face model's
# data, set client_save_img_roi to "../captures/disc_face/".
detection:
  cmd: cls
  path: disc_pass_fail_cropped.pkl
  conf: 0.5
  top_k: 1
frames_avg: 1
display:
  label: 1
  save_img: false
  save_img_roi: false
  client_save_img: false
  client_save_img_roi: false
