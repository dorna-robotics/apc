# The disc's RING on the robot camera — recipes.j2 inspector_robot_ring
# (top_ring), run on the detector's box grown by CLS_ROI_OFFSET px,
# cropped. From the top the disc is a bright face inside a thin olive band
# (~9 px) on the machined holder — too thin and faint for a colour mask +
# elp (it found the band on 0 of 89), so ring measures its two edges along
# rays (workspace docs/vision-guide.md §5 "A thin, faint band — ring"):
#   inner   the face's edge, on Lab lightness — bright face, olive band
#   outer   the band's outer edge, on Lab b — yellowish band, bluish holder
#   width   px past the face's edge the band's outer edge is looked for
# actions.py judges the two centres against the run's ring_offset — no
# chip check here (no dent): from the top the chipped discs' edges read
# whole; the chips show from the bottom. Measured (89 discs, 2026-10-23):
# both circles on 87, centres repeatable to 0.05 / 0.2 px.
detection:
  cmd: ring
  inner: l
  outer: b
  width: 40
frames_avg: 1
display:
  label: 1              # class + conf drawn on the frame
  save_img: false
  save_img_roi: false
  client_save_img: false
  client_save_img_roi: false
