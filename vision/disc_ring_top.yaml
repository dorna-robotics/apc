# The disc's CIRCLES on the robot camera — recipes.j2 inspector_robot_ring
# (top_ring), run on the detector's box grown by CLS_ROI_OFFSET px,
# cropped. The robot camera sees no yellow band: the disc's edge is a
# plain bright-to-dark edge against the holder, so no colour mask. elp
# also finds the holder's recess rings (~5–12 % larger); actions.py keeps
# the circle closest in size to the detector's box. Its conf (the worst
# 10° sector's share of outline) judges a chip; no band, no concentricity.
detection:
  cmd: elp
  nfa_validation: false
  sector_deg: 10
frames_avg: 1
display:
  label: 1
  save_img: false
  save_img_roi: false
  client_save_img: false
  client_save_img_roi: false
